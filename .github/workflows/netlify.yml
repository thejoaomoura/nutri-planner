name: Deploy to Netlify

on:
  push:
    branches:
      - main
      - claude/nutri-planner-netlify-deploy-fbtxsr
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Set GROQ_API_KEY in Netlify
        run: npx --yes netlify-cli env:set GROQ_API_KEY "$GROQ_API_KEY"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: e206583e-7239-436c-8672-cdfc1532a944
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        continue-on-error: true

      - name: Deploy to Netlify
        run: npx --yes netlify-cli deploy --build --prod
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: e206583e-7239-436c-8672-cdfc1532a944
